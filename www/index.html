<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d2c31">
<title>چای خانه</title>
<style>
:root{--bg:#0d2c31;--panel:#143e45;--ink:#fdf3dc;--mut:#9fc4c0;--gold:#f4b400;--tq:#2fbfb0;--line:#266269;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.6}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 96px}
.hd{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:12;background:var(--bg);padding:6px 0}
.coins{font-size:34px;font-weight:900;color:var(--gold);line-height:1.2}
.chips{display:flex;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:15px;font-weight:700}
.rate{color:var(--mut);font-size:14px}
.btn{display:block;width:100%;padding:11px;border-radius:14px;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:15px;font-weight:700;cursor:pointer;margin:8px 0}
.btn:disabled{opacity:.55;cursor:default;border-color:var(--line);color:var(--mut)}
.btn.on{background:var(--gold);color:#3a2a00}
h2{font-size:16px;margin:14px 0 8px;color:var(--mut)}
.town{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plot{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;text-align:right}
.plot svg,.scene svg{display:block;width:100%;height:auto}
.plot .in{padding:6px 10px}.plot b{display:block;font-size:15px}.plot small{color:var(--mut);font-size:12px}
.plot:not(.dim){border-color:var(--tq)}.plot.dim svg{filter:grayscale(.85) brightness(.7)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#modal{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding-top:env(safe-area-inset-top,0px)}
#modal[hidden],section[hidden]{display:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#back{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;cursor:pointer}
.scene{display:block;width:100%;border:0;padding:0;border-radius:18px;overflow:hidden;cursor:pointer;touch-action:manipulation;background:none}
.scene:active svg{transform:scale(.97)}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:6px 0}
.crew{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:42px;font-size:28px;margin:6px 0}
.crew span{animation:bob 1.2s ease-in-out infinite}.crew span:nth-child(2n){animation-delay:.3s}.crew span:nth-child(3n){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px)}}
.up{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-top:9px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:right;cursor:pointer}
.up:disabled{opacity:.5;cursor:default}.up:not(:disabled){border-color:var(--tq)}
.up .nm{flex:1}.up b{display:block;font-size:15px}.up small{color:var(--mut);font-size:13px}.pr{font-weight:900;color:var(--gold);white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 0;font-size:12px}
.day.cur{border-color:var(--gold)}.day.done{opacity:.45}
.bar{height:7px;background:#0005;border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tq)}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a2226;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#nav button{flex:1;background:none;border:0;padding:10px 0 8px;font-size:12px;color:var(--mut);cursor:pointer}
#nav button span{display:block;font-size:22px}#nav button.a{color:var(--gold)}
.pop{position:fixed;pointer-events:none;font-weight:900;color:var(--gold);font-size:22px;animation:fly .9s ease-out forwards;z-index:30;text-shadow:0 2px 0 #0006}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--gold);color:#3a2a00;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:40;max-width:92%;text-align:center}
svg *{transform-box:fill-box;transform-origin:center}
.cl{animation:drift 16s linear infinite}@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(230px)}}
.sm{animation:rise 2.4s ease-out infinite}@keyframes rise{from{opacity:.85;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-20px) scale(1.6)}}
.sw{animation:sway 2.2s ease-in-out infinite;transform-origin:bottom center}@keyframes sway{50%{transform:rotate(7deg)}0%,100%{transform:rotate(-7deg)}}
.sun{animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bb{animation:bb 3s ease-in-out infinite}@keyframes bb{50%{transform:translateY(4px) rotate(2deg)}}
.wk{animation:wk 12s linear infinite}@keyframes wk{from{transform:translateX(-30px)}to{transform:translateX(230px)}}
.gl{animation:gl 2s ease-in-out infinite}@keyframes gl{50%{opacity:.35}}
.night .plot svg,.night .scene svg{filter:brightness(.62) saturate(.9)}
.gift{position:fixed;font-size:46px;z-index:15;cursor:pointer;border:0;background:none;animation:gf 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px #f4b400)}
@keyframes gf{50%{transform:scale(1.2) rotate(8deg)}}
.pulse{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 0 7px #f4b40077}}
.crit{color:#ff6b4a;font-size:30px}
#dim{position:fixed;inset:0;background:#000a;z-index:50}#dim[hidden]{display:none}
#drawer{position:fixed;top:0;bottom:0;right:0;width:82%;max-width:330px;background:#0a2226;z-index:51;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 20px;border-left:1px solid var(--line)}
#drawer.o{transform:none}
.dh{text-align:center;padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:8px}.dh small{display:block;color:var(--mut)}
.di{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 8px;border-radius:12px;font-size:15px;text-align:right;cursor:pointer}.di:active{background:var(--panel)}.di span{font-size:22px;width:30px;text-align:center}
.di.hr{border-top:1px solid var(--line);border-radius:0;margin-top:6px}
#sheet{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:flex-end;justify-content:center}#sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 18px);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tg{width:50px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg[aria-checked=true]{background:var(--tq)}.tg[aria-checked=true]::after{right:25px}
.sh p{color:var(--mut);margin:8px 0}details{background:var(--panel);border-radius:12px;padding:10px 12px;margin:8px 0}summary{cursor:pointer}
.calm svg *,.calm .crew span{animation:none!important}
#splash{position:fixed;inset:0;background:#10343a;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .5s}
#splash .ic{font-size:96px;animation:pl2 1.4s ease-in-out infinite}@keyframes pl2{50%{transform:scale(1.12)}}
#splash b{font-size:30px;color:var(--gold)}#splash small{color:var(--mut)}
.ld{width:150px;height:6px;border-radius:3px;background:#0005;overflow:hidden;margin-top:14px}.ld i{display:block;height:100%;background:var(--tq);animation:ld 1.4s ease-out forwards}@keyframes ld{from{width:0}to{width:100%}}
.tr{font-style:normal;font-size:11px;padding:1px 8px;border-radius:9px;margin-inline-start:6px;color:#10343a;font-weight:700}.t0{background:#7bdc8b}.t1{background:#f4d35e}.t2{background:#f4a259}.t3{background:#ef6f6c}.t4{background:#c792ea}.t5{background:#7aa2ff}
.mgg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mgc{aspect-ratio:1;font-size:30px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.lane{position:relative;height:46px;border-bottom:2px dashed var(--line);margin:14px 0}.lane span{position:absolute;top:2px;font-size:30px}
.mgarea{position:relative;height:55vh;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a2226;touch-action:manipulation}
.fall{position:absolute;top:-40px;font-size:34px;background:none;border:0;animation:fl 2.2s linear forwards}@keyframes fl{to{top:105%}}
#mg{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;padding-top:env(safe-area-inset-top,0px)}#mg[hidden]{display:none}
.mgg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:auto}.mgg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:330px;margin:auto}
.mgp{height:110px;border:0;border-radius:18px;cursor:pointer;transition:filter .1s}
.pbar{position:relative;height:44px;background:#0a2226;border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.pz{position:absolute;top:0;bottom:0;background:#2fbfb0aa}.pm{position:absolute;top:0;bottom:0;width:4%;background:var(--gold)}
@media (prefers-reduced-motion:reduce){svg *,.crew span,.gift,.pulse{animation:none!important}.pop{animation:none;opacity:0}}
</style>
</head>
<body>
<div id="splash"><img class="ic lg" alt="" width="120" height="120" style="border-radius:26px"><b>چای خانه</b><small>شهرت را بساز</small><div class="ld"><i></i></div></div>
<div id="toast"></div>
<div class="wrap">
 <div class="hd"><button class="chip" id="menu" aria-label="منو">☰</button><div class="coins" id="coins"></div><div class="chips"><span class="chip" id="gems"></span><button class="chip" id="snd" aria-label="صدا">🔊</button></div></div>
 <div class="rate" id="rate"></div>
 <section id="v0">
  <button class="btn" id="boost"></button>
  <button class="btn" id="chal"></button>
  <button class="btn" id="mgbtn"></button>
  <h2>شهر تو: روی هر مکان بزن و واردش شو</h2>
  <div class="town" id="town"></div>
  <button class="up" id="pres"><span style="font-size:30px">🌟</span><span class="nm"><b>عصر جدید</b><small></small></span><span class="pr"></span></button>
 </section>
 <section id="v1" hidden>
  <div id="promo"></div>
  <h2>جایزه‌ی روزانه</h2><div class="days" id="days"></div>
  <button class="btn" id="claim"></button>
  <button class="btn" id="ad"></button>
  <h2>فروشگاه</h2><div id="shop"></div>
 </section>
 <section id="v2" hidden><h2>ماموریت‌ها</h2><div id="mis"></div></section>
</div>
<nav id="nav"><button class="a"><span>🏘️</span>شهر</button><button><span>🛍️</span>فروشگاه</button><button><span>🎯</span>ماموریت</button></nav>
<div id="mg" hidden><div class="wrap"><div class="mh"><b id="mgt"></b><button id="mgx" class="chip" aria-label="بستن">✕</button></div><div id="mgb"></div></div></div>
<div id="dim" hidden></div>
<aside id="drawer"><div class="dh"><img class="lg" alt="" width="72" height="72" style="border-radius:16px"><b>چای خانه</b><small id="dsub"></small></div><div id="dl"></div></aside>
<div id="sheet" hidden><div class="sh"><div class="mh"><b id="st"></b><button id="sx" class="chip" aria-label="بستن">✕</button></div><div id="sb"></div></div></div>
<div id="modal" hidden><div class="wrap">
 <div class="mh"><button id="back">برگشت به شهر</button><div class="coins" id="mcoins"></div></div>
 <button class="scene" id="scene" aria-label="برای تولید بزن"></button>
 <div class="hint" id="hint"></div><div class="crew" id="crew"></div>
 <button class="up" id="buy"><span class="nm"><b></b><small></small></span><span class="pr"></span></button>
 <button class="up" id="cup"><span class="nm"><b>استکان کمرباریک</b><small></small></span><span class="pr"></span></button>
</div></div>

 const nb=i=>[i-3,i+3,i%3?i-1:-1,i%3<2?i+1:-1].filter(j=>j>=0&&j<9);
 for(let k=0;k<60+Math.min(80,S.mgN*8);k++){const m=nb(z),j=m[Math.floor(Math.random()*m.length)];[a[z],a[j]]=[a[j],a[z]];z=j}
 const info=mk(el,"p","",""),g=mk(el,"div","mgg3",""),bs=[];
 const draw=()=>bs.forEach((b,i)=>{b.textContent=a[i]?fa(a[i]):"";b.style.visibility=a[i]?"visible":"hidden"});
 for(let i=0;i<9;i++)bs.push(mk(g,"button","mgc","",()=>{if(fin||!nb(z).includes(i))return;[a[z],a[i]]=[a[i],a[z]];z=i;snd(500,.03);draw();if(a.every((v,k)=>v==(k+1)%9)){fin=true;clearInterval(iv);done(true)}}));
 draw();const txt=()=>info.textContent="⏱ "+fa(t)+" ثانیه · اعداد را از ۱ تا ۸ مرتب کن (لغزاندن کاشی‌ها)";txt();
 const iv=setInterval(()=>{t--;txt();if(t<=0&&!fin){fin=true;clearInterval(iv);done(false)}},1000);return()=>clearInterval(iv)}
function mgSimon(el,done){const C=["#ef6f6c","#f4d35e","#7bdc8b","#7aa2ff"],need=Math.min(8,4+Math.floor(S.mgN/3));let seq=[],pos=0,busy=true,fin=false;
 const info=mk(el,"p","",""),g=mk(el,"div","mgg2","");
 const flash=i=>{snd(400+i*120,.15);ps[i].style.filter="brightness(1.8)";setTimeout(()=>ps[i].style.filter="",250)};
 const ps=C.map((c,i)=>{const b=mk(g,"button","mgp","",()=>{if(busy||fin)return;flash(i);if(i!==seq[pos]){fin=true;done(false);return}pos++;if(pos==seq.length){if(seq.length>=need){fin=true;done(true)}else{busy=true;setTimeout(next,700)}}});b.style.background=c;return b});
 const next=()=>{if(fin)return;seq.push(Math.floor(Math.random()*4));pos=0;info.textContent="نگاه کن... ("+fa(seq.length)+" از "+fa(need)+")";let k=0;const iv=setInterval(()=>{if(fin){clearInterval(iv);return}if(k>=seq.length){clearInterval(iv);busy=false;info.textContent="حالا تو تکرار کن!";return}flash(seq[k++])},650)};
 setTimeout(next,600);return()=>{fin=true}}
function mgMole(el,done){let sc=0,t=25,fin=false,up=-1;const need=14+Math.min(8,S.mgN),info=mk(el,"p","",""),g=mk(el,"div","mgg3","");
 const upd=()=>info.textContent="🐭 "+fa(sc)+" / "+fa(need)+" · ⏱ "+fa(t);
 const hs=Array.from({length:9},(_,i)=>mk(g,"button","mgc","🕳️",()=>{if(fin||i!==up)return;sc++;up=-1;hs[i].textContent="💥";setTimeout(()=>{hs[i].textContent="🕳️"},250);snd(700,.06);upd();if(sc>=need){fin=true;stop();done(true)}}));
 const stop=()=>{clearInterval(a);clearInterval(b)};upd();
 const a=setInterval(()=>{if(up>=0)hs[up].textContent="🕳️";up=Math.floor(Math.random()*9);hs[up].textContent="🐭"},Math.max(450,800-S.mgN*25));
 const b=setInterval(()=>{t--;upd();if(t<=0&&!fin){fin=true;stop();done(false)}},1000);return stop}
function mgPour(el,done){let x=0,d=1,hit=0,tries=0,fin=false;const zw=Math.max(14,26-S.mgN*1.5),sp=1.6+Math.min(1.6,S.mgN*.12);
 mk(el,"p","","وقتی نشانگر توی ناحیه‌ی سبز بود دکمه را بزن! ۴ بار فرصت داری، ۳ بار درست بزن.");
 const bar=mk(el,"div","pbar","<i class='pz'></i><b class='pm'></b>"),z=bar.querySelector(".pz"),m=bar.querySelector(".pm"),info=mk(el,"p","","");
 let zs=20+Math.random()*50;const place=()=>{z.style.right=zs+"%";z.style.width=zw+"%"};place();
 const iv=setInterval(()=>{x+=d*sp;if(x>=100){x=100;d=-1}if(x<=0){x=0;d=1}m.style.right=x*.96+"%"},16);
 const upd=()=>info.textContent="✅ "+fa(hit)+" / ۳ · تلاش "+fa(tries)+" از ۴";upd();
 mk(el,"button","btn","🫖 بریز!",()=>{if(fin)return;tries++;if(x>=zs&&x<=zs+zw){hit++;ok()}else snd(200,.15);upd();zs=10+Math.random()*(80-zw);place();if(hit>=3){fin=true;clearInterval(iv);done(true)}else if(tries>=4){fin=true;clearInterval(iv);done(false)}});return()=>clearInterval(iv)}
function mgMath(el,done){let right=0,t=30,fin=false,ans=0;const need=6+Math.min(4,Math.floor(S.mgN/2)),info=mk(el,"p","",""),q=mk(el,"h2","",""),box=mk(el,"div","","");
 const upd=()=>info.textContent="✅ "+fa(right)+" / "+fa(need)+" · ⏱ "+fa(t)+" (جواب غلط ۳ ثانیه کم می‌کند)";
 const next=()=>{const m=S.mgN>6,a=2+Math.floor(Math.random()*(m?12:9)),b=2+Math.floor(Math.random()*(m?12:9)),op=Math.random()<.5?"+":"×";ans=op=="+"?a+b:a*b;q.textContent=fa(a)+" "+op+" "+fa(b)+" = ؟";
  const opts=new Set([ans]);while(opts.size<3)opts.add(Math.max(0,ans+Math.floor(Math.random()*11)-5));box.innerHTML="";
  [...opts].sort(()=>Math.random()-.5).forEach(v=>mk(box,"button","btn",fa(v),()=>{if(fin)return;if(v==ans){right++;snd(700,.06);if(right>=need){fin=true;clearInterval(iv);done(true);return}}else{t=Math.max(1,t-3);snd(200,.15)}upd();next()}))};
 upd();next();const iv=setInterval(()=>{t--;upd();if(t<=0&&!fin){fin=true;clearInterval(iv);done(false)}},1000);return()=>clearInterval(iv)}
const MGS=[["🧩","پازل حافظه","جفت کارت‌ها را در ۴۵ ثانیه پیدا کن.",mgMemory],["🚴","مسابقه‌ی دوچرخه","سریع‌تر از حریف پدال بزن.",mgBike],["☕","چای بگیر","استکان‌ها را بگیر و از بمب‌ها فرار کن.",mgCatch],["🔢","پازل لغزشی","اعداد را از ۱ تا ۸ مرتب کن.",mgSlide],["🎨","رنگ‌های حافظه","ترتیب رنگ‌ها را به خاطر بسپار و تکرار کن.",mgSimon],["🐭","موش‌کوبی","موش‌هایی که از سوراخ بیرون می‌آیند را بزن.",mgMole],["🫖","چای‌ریزی","در زمان درست چای را بریز.",mgPour],["➕","حساب سریع","سریع جواب بده و وقت را از دست نده.",mgMath]];
let mgStop=null;
function openMG(why){const g=MGS[S.mgN%MGS.length],el=$("mgb");el.innerHTML="";$("mgt").textContent=g[0]+" "+g[1];$("mg").hidden=false;
 mk(el,"p","",(why?"🎉 "+why+"<br>":"")+g[2]+"<br>جایزه: جواهر و سکه");
 mk(el,"button","btn","▶️ شروع",()=>{el.innerHTML="";mgStop=g[3](el,r=>{mgStop=null;mgEnd(r)})})}
function closeMG(){if(mgStop){mgStop();mgStop=null}$("mg").hidden=true;render()}
function mgEnd(win){const el=$("mgb");el.innerHTML="";if(S.mgDay!=today()){S.mgDay=today();S.mgToday=0}
 const cap=S.mgToday<6;S.mgToday++;const gems=cap?(win?Math.min(10,4+Math.floor(S.mgN/3)):1):0,coins=Math.max(100,base()*(win?1800:300));
 S.gems+=gems;add(coins);S.mgN++;S.mgPend=0;S.mgReady=Date.now()+600000;if(win)ok();else snd(200,.3);
 mk(el,"p","","<b>"+(win?"🏆 بردی!":"😅 این‌بار نشد")+"</b><br>جایزه: "+(gems?fa(gems)+" جواهر 💎 و ":"")+fmt(coins)+" سکه 🪙"+(cap?"":"<br><small>سقف جواهر امروز پر شد؛ فردا دوباره.</small>"));
 mk(el,"button","btn","ادامه",closeMG);render()}
$("mgx").onclick=closeMG;
$("mgbtn").onclick=()=>{if(S.mgPend||Date.now()>=S.mgReady)openMG("");else toast("مینی‌بازی بعدی تا "+fa(Math.ceil((S.mgReady-Date.now())/1000))+" ثانیه دیگر")};
function gift(){if(cur>=0||$("v0").hidden||document.querySelector(".gift"))return;const b=document.createElement("button");b.className="gift";b.textContent="🎁";b.setAttribute("aria-label","هدیه");b.style.left=(8+Math.random()*70)+"%";b.style.top=(25+Math.random()*45)+"%";
 b.onclick=()=>{if(Math.random()<.7){const g=Math.max(50,base()*mult()*120);add(g);toast("هدیه: "+fmt(g)+" سکه 🪙")}else{const n=2+Math.floor(Math.random()*5);S.gems+=n;toast("هدیه: "+fa(n)+" جواهر 💎")}ok();vib(30);b.remove();render()};
 document.body.appendChild(b);setTimeout(()=>b.remove(),9000)}
setInterval(()=>{if(Math.random()<.35)gift()},20000);
if(CFG.ads)initAds();setTimeout(()=>{$("splash").style.opacity=0;setTimeout(()=>$("splash").remove(),500)},1400);
if(!S.tut)setTimeout(()=>toast("👆 روی چایخانه بزن و ماجرا شروع می‌شود"),800);
render();
