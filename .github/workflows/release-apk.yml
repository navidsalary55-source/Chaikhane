name: Build Release APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: npm install
      - run: npx cap add android
      - name: Prepare icon and splash sources
        run: |
          mkdir -p assets
          cp icon.dat assets/icon-only.png
          if [ -f splash.dat ]; then cp splash.dat assets/splash.png; cp splash.dat assets/splash-dark.png; fi
      - run: npx capacitor-assets generate --android
        continue-on-error: true
      - name: Install app icon
        run: |
          pip install pillow
          python3 - << 'PYEND'
          from PIL import Image,ImageDraw,ImageFilter
          import os,sys
          p=next((x for x in ("icon.dat","icon.png","assets/icon-only.png") if os.path.exists(x)),None)
          if not p:
              print("ERROR: icon.dat not found in repo root");sys.exit(1)
          res="android/app/src/main/res";W=512
          src=Image.open(p).convert("RGBA").resize((W,W),Image.LANCZOS)
          c=src.convert("RGB").crop((int(W*.2),int(W*.15),int(W*.8),int(W*.85))).resize((W,W)).filter(ImageFilter.GaussianBlur(22))
          fg=c.convert("RGBA");s=int(W*.62);fg.alpha_composite(src.resize((s,s),Image.LANCZOS),((W-s)//2,(W-s)//2))
          m=Image.new("L",(W,W),0);ImageDraw.Draw(m).ellipse([0,0,W-1,W-1],fill=255)
          rnd=Image.new("RGBA",(W,W),(0,0,0,0));rnd.paste(src,(0,0),m)
          D={"mdpi":(48,108),"hdpi":(72,162),"xhdpi":(96,216),"xxhdpi":(144,324),"xxxhdpi":(192,432)}
          for k,(a,f) in D.items():
              d=res+"/mipmap-"+k;os.makedirs(d,exist_ok=True)
              src.resize((a,a),Image.LANCZOS).save(d+"/ic_launcher.png")
              rnd.resize((a,a),Image.LANCZOS).save(d+"/ic_launcher_round.png")
              fg.resize((f,f),Image.LANCZOS).save(d+"/ic_launcher_foreground.png")
          os.makedirs(res+"/mipmap-anydpi-v26",exist_ok=True);os.makedirs(res+"/values",exist_ok=True)
          x='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@color/chaikhane_icon_bg"/>\n<foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ("ic_launcher","ic_launcher_round"):open(res+"/mipmap-anydpi-v26/"+n+".xml","w").write(x)
          open(res+"/values/chaikhane_icon.xml","w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="chaikhane_icon_bg">#8B1C1C</color></resources>\n')
          print("ICON FILES WRITTEN from",p)

          PYEND
          ls android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26
      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Allow detecting the promo app
        run: |
          PKG=$(grep -o 'promoPkg:"[^"]*"' www/index.html | head -1 | cut -d'"' -f2)
          if [ -n "$PKG" ]; then sed -i "s#</manifest>#<queries><package android:name=\"$PKG\"/></queries></manifest>#" android/app/src/main/AndroidManifest.xml; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "ERROR: secret KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > chaikhane.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNS=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $UNS aligned.apk
          $BT/apksigner sign --ks chaikhane.jks --ks-key-alias chaikhane --ks-pass env:KS_PASS --key-pass env:KS_PASS --out chaikhane-release.apk aligned.apk
          $BT/apksigner verify chaikhane-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chaikhane-release-apk
          path: chaikhane-release.apk
