name: Create keystore
on:
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_PASS" || { echo "ERROR: secret KEYSTORE_PASSWORD is missing"; exit 1; }
          keytool -genkeypair -keystore chaikhane.jks -alias chaikhane -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Chaikhane, O=Chaikhane, C=IR"
          base64 -w0 chaikhane.jks > keystore.b64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            chaikhane.jks
            keystore.b64.txt
